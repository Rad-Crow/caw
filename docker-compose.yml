services:
  caw:
    build: .
    image: caw:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CAW_LISTEN:-127.0.0.1}:${CAW_PORT:-8080}:8080"
    volumes:
      - ./data/caw:/data

  # tls termination; omit the profile when using an existing proxy
  caddy:
    image: docker.io/library/caddy:2.8
    profiles: [caddy]
    restart: unless-stopped
    environment:
      CAW_DOMAIN: ${CAW_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  # host networking avoids mapping the relay port range
  coturn:
    image: docker.io/coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_SECRET: ${CAW_TURN_SECRET:?set CAW_TURN_SECRET}
      TURN_REALM: ${CAW_TURN_REALM:?set CAW_TURN_REALM}
      TURN_PORT: ${CAW_TURN_PORT:-3478}
      TURN_MIN_PORT: ${CAW_TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${CAW_TURN_MAX_PORT:-49200}
      TURN_EXTERNAL_IP: ${CAW_TURN_EXTERNAL_IP:-}
    # via sh so --external-ip is passed only when set
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec turnserver -c /etc/coturn/turnserver.conf
        --static-auth-secret="$$TURN_SECRET" --realm="$$TURN_REALM"
        --listening-port="$$TURN_PORT" --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT"
        $${TURN_EXTERNAL_IP:+--external-ip="$$TURN_EXTERNAL_IP"}
