[versions]
agp = "8.7.3"
kotlin = "2.1.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
webrtc = "129.0.0"
unifiedpush = "3.0.10"
bouncycastle = "1.80"
coreTelecom = "1.0.1"
biometric = "1.1.0"
fragment = "1.8.5"
media3 = "1.5.1"
work = "2.10.0"
zxing = "4.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
webrtc = { module = "im.conversations.webrtc:webrtc-android", version.ref = "webrtc" }
unifiedpush = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
core-telecom = { module = "androidx.core:core-telecom", version.ref = "coreTelecom" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
zxing = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
